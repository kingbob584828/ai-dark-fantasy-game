name: Build & Release Godot 4.3 Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'godot-android-apk-release'
  cancel-in-progress: true

jobs:
  build-and-release-godot-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Accept Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Generate Android Debug & Release Keystores
        run: |
          rm -f /tmp/release-keystore.jks /tmp/debug.keystore
          mkdir -p ~/.local/share/godot/keystores
          keytool -genkeypair -v \
            -keystore /tmp/release-keystore.jks \
            -alias ashenkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ashenfields123 \
            -keypass ashenfields123 \
            -dname "CN=AshenFields, OU=Game, O=AshenFields, L=Vigil, S=Ash, C=US"
          keytool -genkeypair -v \
            -keystore /tmp/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          cp /tmp/debug.keystore ~/.local/share/godot/keystores/debug.keystore

      - name: Install Godot 4.3 Engine & Export Signed Android APK
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable ~/.config/godot
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q -o /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q -o /tmp/templates.tpz -d /tmp/templates
          mv -f /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="/tmp/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="/tmp/release-keystore.jks"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="ashenkey"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="ashenfields123"
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path ./godot --import
          sed -i "s|export/android/java_sdk_path = \"\"|export/android/java_sdk_path = \"${JAVA_HOME}\"|g" ~/.config/godot/editor_settings-4.3.tres
          sed -i "s|export/android/android_sdk_path = \"\"|export/android/android_sdk_path = \"${ANDROID_SDK_ROOT}\"|g" ~/.config/godot/editor_settings-4.3.tres
          sed -i "s|export/android/shutdown_adb_on_exit = true|export/android/shutdown_adb_on_exit = false|g" ~/.config/godot/editor_settings-4.3.tres
          grep "export/android" ~/.config/godot/editor_settings-4.3.tres
          /tmp/Godot_v4.3-stable_linux.x86_64 --headless --verbose --path ./godot --export-release "Android" /tmp/AshenFields-Godot4-v1.0.0.apk
          cp /tmp/AshenFields-Godot4-v1.0.0.apk ./AshenFields-Godot4-v1.0.0.apk
          ls -lh ./AshenFields-Godot4-v1.0.0.apk
          zip -r ./AshenFields-Godot4-Engine-Project.zip ./godot

      - name: Upload Godot 4.3 Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AshenFields-Godot4-Android-APK
          path: |
            ./AshenFields-Godot4-v1.0.0.apk
            ./AshenFields-Godot4-Engine-Project.zip

      - name: Ensure Release Tag v1.0.0 Exists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v1.0.0
          git push -f origin v1.0.0 || true

      - name: Publish Signed Godot 4.3 Android APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: "Ashen Fields v1.0.0 — Official Godot 4.3 Android APK Release"
          body: |
            ### Ashen Fields — Canticles of the Seventh Star (Godot 4.3 Engine Release)
            - **Download Signed Android APK (`AshenFields-Godot4-v1.0.0.apk`)**: Built 100% natively with **Godot Engine 4.3 (`gl_compatibility` mobile renderer)** and GDScript 2.0 (`GameWorld.gd`, `PixelArtGenerator.gd`, `AudioSynthesizer.gd`).
            - **Download Godot 4.3 Engine Source Project (`AshenFields-Godot4-Engine-Project.zip`)**: Complete Godot 4.3 project (`project.godot`, `export_presets.cfg`, `scenes/Main.tscn`, and `scripts/*.gd`).

            #### Key Features in the Godot 4.3 Android APK
            - **6 Interconnected Populated Regions**: Oakhaven Vigil, The Weeping Woods, Drowned Fens, Whispering Barrow, Sunken Reliquary, and The Star-Crater.
            - **Rich World Architecture**: Multi-tile Gothic structures, cobblestone highways, timber bridges, shimmering lakes & lava craters, shrines, Star-Iron anvils, chests, and harvestable resource nodes.
            - **7 Autonomous AI NPCs**: Real-time waypoint schedules, dynamic overhead speech bubbles, active combat targeting against nearby monsters, multi-branch lore dialogue, item bartering, and companion recruitment.
            - **6 Attributes, 7 Weapons & 6 Magic Schools + 3 Synergies**: Full RPG character progression, Star-Iron weapon tempering (`+1` to `+5`), and persistent save/load (`user://ashen_fields_save.json`).
            - **Ergonomic Mobile Multi-Touch Controls**: Left-side virtual analog thumbstick with sprint ring, right-side 6-button arc combat cluster (`STRIKE`, `ROLL`, `CAST`, `CYCLE`, `HEAL`, `TALK`), top-right tactical mini-map radar, and Android haptic feedback (`Input.vibrate_handheld`).
          files: |
            ./AshenFields-Godot4-v1.0.0.apk
            ./AshenFields-Godot4-Engine-Project.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
