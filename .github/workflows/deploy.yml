name: Build & Release Live Web Preview + Native Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-apk'
  cancel-in-progress: true

jobs:
  # 1. Build Static Web Bundle & Deploy to GitHub Pages
  build-and-deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize package.json versions for public npm registry
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies = {
              "@google/genai": "^1.0.0",
              "@tailwindcss/vite": "^4.0.9",
              "@vitejs/plugin-react": "^4.3.4",
              "dotenv": "^16.4.7",
              "express": "^4.21.2",
              "lucide-react": "^0.475.0",
              "motion": "^12.4.7",
              "react": "^19.0.0",
              "react-dom": "^19.0.0",
              "vite": "^6.2.0"
            };
            pkg.devDependencies = {
              "@types/express": "^4.17.21",
              "@types/node": "^22.13.5",
              "@types/react": "^19.0.10",
              "@types/react-dom": "^19.0.4",
              "autoprefixer": "^10.4.20",
              "tailwindcss": "^4.0.9",
              "tsx": "^4.19.3",
              "typescript": "^5.7.3"
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

      - name: Install dependencies from public npm
        run: npm install --legacy-peer-deps

      - name: Build static playable web game
        run: npm run build

      - name: Deploy web bundle to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        continue-on-error: true

  # 2. Build 100% Native Android APK (Hardware Canvas + AudioTrack, No WebView) & Publish to GitHub Releases
  build-and-release-native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Provision Platform 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Release Signing Keystore
        working-directory: ./android/app
        run: |
          rm -f release-keystore.jks
          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -alias ashenkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ashenfields123 \
            -keypass ashenfields123 \
            -dname "CN=AshenFields, OU=Game, O=AshenFields, L=Vigil, S=Ash, C=US"

      - name: Build Signed Native Android Release APK
        working-directory: ./android
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../AshenFields-Native-v1.0.0.apk

      - name: Upload Native APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AshenFields-Native-Android-APK
          path: ./AshenFields-Native-v1.0.0.apk

      - name: Ensure Release Tag v1.0.0 Exists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v1.0.0
          git push -f origin v1.0.0 || true

      - name: Publish Native APK & Web Preview Link to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: "Ashen Fields v1.0.0 — Native Android APK & Live Web Release"
          body: |
            ### Ashen Fields — Cross-Platform Release
            - **Live Web Preview (GitHub Pages)**: [https://kingbob584828.github.io/ai-dark-fantasy-game/](https://kingbob584828.github.io/ai-dark-fantasy-game/) (Supports `F11` & UI Fullscreen toggle)
            - **Native Android APK (`AshenFields-Native-v1.0.0.apk`)**: 100% Native Android hardware-accelerated 2D `Canvas` & `AudioTrack` PCM synth engine (Zero WebView). Supports Multi-Touch Twin-Stick + 6-Button Combat Cluster, Bluetooth/USB Gamepad Controllers, and Hardware Keyboards in landscape fullscreen.
          files: ./AshenFields-Native-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
